<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOUR SHOP — Luxury Timepieces</title>
  <style>
    :root {
      --bg: #FAF7F2;
      --surface: #FFFFFF;
      --beige: #F3ECE1;
      --border: #E5D9C7;
      --text: #1F1916;
      --muted: #6E6257;
      --gold: #9A7643;
      --green: #1E6B45;
      --red: #B83227;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    a, button { touch-action: manipulation; cursor: pointer; font-family: inherit; }

    /* Promo Bar */
    .promo-bar {
      background: var(--text);
      color: #FAF7F2;
      text-align: center;
      padding: 9px 12px;
      font-size: 12px;
      letter-spacing: 0.4px;
    }
    .promo-bar strong { color: #E8C99B; }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .brand {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--text);
      text-transform: uppercase;
    }
    .brand span { color: var(--gold); }
    .bag-btn {
      background: var(--text);
      color: #FFF;
      border: none;
      padding: 9px 15px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
    }

    /* Filter & Coupon Strip */
    .toolbar {
      max-width: 1200px;
      margin: 18px auto 0;
      padding: 0 16px;
    }
    .coupon-banner {
      background: var(--beige);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    .coupon-banner h2 { font-size: 15px; font-weight: 700; }
    .coupon-banner p { font-size: 13px; color: var(--muted); }
    .coupon-btn {
      background: var(--gold);
      color: #FFF;
      border: none;
      padding: 9px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .coupon-btn.applied { background: var(--green); }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .filter-pill {
      white-space: nowrap;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
    }
    .filter-pill.active {
      background: var(--text);
      color: #FFF;
      border-color: var(--text);
    }

    /* Product Grid */
    .grid {
      max-width: 1200px;
      margin: 16px auto 50px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
      gap: 20px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 4px 18px rgba(31, 25, 22, 0.04);
    }
    .media-box {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.2;
      background: var(--beige);
      overflow: hidden;
    }
    .media-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

      position: absolute;
      top: 12px;
      left: 12px;

      color: #FFF;
